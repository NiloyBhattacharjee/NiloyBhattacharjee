<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Niloy Bhattacharjee — Full Stack Developer, AWS and Python">
  <defs>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A00"/>
      <stop offset="1" stop-color="#FFB000"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#FF6A00" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FF6A00" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d2 { animation-delay: .4s } .d3 { animation-delay: .8s } .d4 { animation-delay: 1.2s } .d5 { animation-delay: 1.6s }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.8) } 50% { opacity: 1; transform: scale(1.15) } }
      .dash { stroke-dasharray: 6 10; animation: flow 3s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -64 } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
  <rect width="1200" height="320" rx="18" fill="#0B0B0B"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#halo)"/>

  <!-- left accent bar -->
  <rect x="64" y="86" width="8" height="148" rx="4" fill="url(#glow)"/>

  <!-- text -->
  <text x="98" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Niloy Bhattacharjee</text>
  <text x="100" y="188" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="url(#glow)">Full Stack Developer · AWS &amp; Python</text>
  <text x="100" y="228" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" fill="#9A9A9A">simulation · data pipelines · AI agents · Sydney</text>

  <!-- event timeline motif (discrete events) -->
  <g transform="translate(780 70)">
    <line x1="0" y1="90" x2="360" y2="90" stroke="#FF6A00" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="0" y1="90" x2="360" y2="90" stroke="#FF8A00" stroke-width="2" class="dash"/>
    <path d="M40 90 Q 90 10 150 90 T 260 90 T 340 90" fill="none" stroke="#FF6A00" stroke-opacity="0.5" stroke-width="1.5"/>
    <g fill="#0B0B0B" stroke="url(#glow)" stroke-width="3">
      <circle cx="40" cy="90" r="9" class="pulse"/>
      <circle cx="110" cy="90" r="9" class="pulse d2"/>
      <circle cx="190" cy="90" r="9" class="pulse d3"/>
      <circle cx="260" cy="90" r="9" class="pulse d4"/>
      <circle cx="340" cy="90" r="9" class="pulse d5"/>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#FF9A3C">
      <text x="28" y="124">t₀</text><text x="98" y="124">t₁</text><text x="178" y="124">t₂</text><text x="248" y="124">t₃</text><text x="328" y="124">t₄</text>
    </g>
    <rect x="0" y="150" width="120" height="30" rx="15" fill="none" stroke="#FF6A00" stroke-opacity="0.6"/>
    <text x="60" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#FFB000">event queue</text>
  </g>

  <!-- bottom stripe -->
  <rect x="0" y="312" width="1200" height="8" fill="url(#glow)"/>
  </g>
</svg>
